name: Native build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-numpy
      - name: Fetch pinned headers and build
        shell: msys2 {0}
        run: |
          python tools/fetch_dependencies.py --with-vapoursynth
          python tools/build.py --compiler g++ --parallel 2
          python tools/verify_fft_codelets.py --compiler g++
      - name: Package local artifact
        shell: msys2 {0}
        run: python tools/package_release.py --binary build/dfttestvk.dll --platform windows
      - uses: actions/upload-artifact@v4
        with:
          name: dfttestvk-windows-x86_64
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    container: python:3.13-slim-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++ clang cmake ninja-build git file binutils
          python -m pip install numpy
      - name: Fetch pinned headers and verify GCC and Clang builds
        run: |
          python tools/fetch_dependencies.py --with-vapoursynth
          python tools/linux/verify.py --source "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/build-linux-check"
      - name: Package local artifact
        run: python tools/package_release.py --binary build-linux-check/build-gcc/dfttestvk.so --platform linux --output dist/dfttestvk-linux-trixie-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dfttestvk-linux-x86_64
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dfttestvk-linux-compiler-verification
          path: build-linux-check/
          if-no-files-found: error
